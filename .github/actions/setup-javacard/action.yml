name: Set up JavaCard
description: Install the JavaCard SDK, simulator, and build dependencies

runs:
  using: composite
  steps:
  - name: Download JavaCard SDK
    uses: ./.github/actions/cached-download
    with:
      path: ${{ github.workspace }}/.cache/javacard/javacard-sdks.tar.gz
      url: https://github.com/martinpaljak/oracle_javacard_sdks/archive/6a75ec0d6913db236d354f154df7dbc9573d976d.tar.gz
      sha256: 067dc8b7d87130baf02fc57e1e8d5aa531d0a57830039ea82933e421e209f486

  - name: Download Oracle JavaCard Simulator
    uses: ./.github/actions/cached-download
    with:
      path: ${{ github.workspace }}/.cache/javacard/java-card-simulator.tar.gz
      url: https://download.oracle.com/otn-pub/java/java_card_kit/3.2/java_card_devkit_simulator-linux-bin-v26.0-b_788-05-MAY-2026.tar.gz
      sha256: b8b999c3e1cfac5d56f7ef16654ce28c99cf472d96761d419a03ddf11f5811c0
      cookie: oraclelicense=accept-securebackup-cookie

  - name: Download GlobalPlatformPro
    uses: ./.github/actions/cached-download
    with:
      path: ${{ github.workspace }}/.cache/javacard/gp.jar
      url: https://github.com/martinpaljak/GlobalPlatformPro/releases/download/v24.10.15/gp.jar
      sha256: a68eca9ab9be84a0560b2d312ca6a18cd2dbcd223bb7b30525e0e0f85a372696

  - name: Set up JavaCard SDK
    shell: bash
    run: |
      mkdir -p "$RUNNER_TEMP/oracle_javacard_sdks"
      cd "$RUNNER_TEMP/oracle_javacard_sdks"
      tar -xzf "$GITHUB_WORKSPACE/.cache/javacard/javacard-sdks.tar.gz" \
        --strip-components=1
      ls -la jc305u4_kit/lib/api_classic.jar

  - name: Set up Oracle JavaCard Simulator
    shell: bash
    run: |
      sudo apt-get update
      sudo apt-get install --yes gcc-multilib gpshell pcscd pcsc-tools
      sudo mkdir -p /opt/javacard/simulator
      sudo tar -xzf \
        "$GITHUB_WORKSPACE/.cache/javacard/java-card-simulator.tar.gz" \
        -C /opt/javacard/simulator
      sudo java -jar /opt/javacard/simulator/tools/Configurator.jar \
        -binary /opt/javacard/simulator/runtime/bin/jcsl \
        -SCP-keyset \
          10 \
          404142434445464748494A4B4C4D4E4F \
          404142434445464748494A4B4C4D4E4F \
          404142434445464748494A4B4C4D4E4F \
        -global-pin 01020304050f 03
      cp "$GITHUB_WORKSPACE/.cache/javacard/gp.jar" "$RUNNER_TEMP/gp.jar"

  - name: Install api_classic.jar to local Maven repository
    shell: bash
    run: |
      mvn $MAVEN_CLI_OPTS \
        install:install-file \
        -Dfile="$RUNNER_TEMP/oracle_javacard_sdks/jc305u4_kit/lib/api_classic.jar" \
        -DgroupId=com.oracle.javacard -DartifactId=api-classic \
        -Dversion=3.0.5 -Dpackaging=jar
