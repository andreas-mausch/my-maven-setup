name: Publish Maven artifact

on:
  push:
    tags:
    - 'maven-build-config-v*'
    - 'java-parent-v*'
    - 'javacard-parent-v*'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v7.0.1

    - name: Set up JDK 25
      uses: actions/setup-java@v6.0.1
      with:
        distribution: temurin
        java-version: 25

    - name: Determine artifact
      id: release
      shell: bash
      run: |
        case "$GITHUB_REF_NAME" in
          maven-build-config-v*)
            echo "artifact=maven-build-config" >> "$GITHUB_OUTPUT"
            echo "pom=maven-build-config/pom.xml" >> "$GITHUB_OUTPUT"
            echo "version=${GITHUB_REF_NAME#maven-build-config-v}" >> "$GITHUB_OUTPUT"
            ;;
          java-parent-v*)
            echo "artifact=java-parent" >> "$GITHUB_OUTPUT"
            echo "pom=parent-java.xml" >> "$GITHUB_OUTPUT"
            echo "version=${GITHUB_REF_NAME#java-parent-v}" >> "$GITHUB_OUTPUT"
            ;;
          javacard-parent-v*)
            echo "artifact=javacard-parent" >> "$GITHUB_OUTPUT"
            echo "pom=parent-javacard.xml" >> "$GITHUB_OUTPUT"
            echo "version=${GITHUB_REF_NAME#javacard-parent-v}" >> "$GITHUB_OUTPUT"
            ;;
          *)
            echo "Unsupported release tag: $GITHUB_REF_NAME" >&2
            exit 1
            ;;
        esac

    - name: Validate release version
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        POM: ${{ steps.release.outputs.pom }}
        TAG_VERSION: ${{ steps.release.outputs.version }}
      shell: bash
      run: |
        POM_VERSION="$(mvn --batch-mode --no-transfer-progress --quiet \
          --settings .github/maven-settings.xml \
          --file "$POM" help:evaluate -Dexpression=project.version -DforceStdout -Dstyle.color=never)"

        if [[ "$POM_VERSION" != "$TAG_VERSION" ]]; then
          echo "Tag version $TAG_VERSION does not match $POM version $POM_VERSION." >&2
          exit 1
        fi

        if grep --quiet -- '-SNAPSHOT' "$POM"; then
          echo "$POM contains a SNAPSHOT version and cannot be published as a release." >&2
          exit 1
        fi

    - name: Publish ${{ steps.release.outputs.artifact }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        mvn --batch-mode --no-transfer-progress \
          --settings .github/maven-settings.xml \
          --file "${{ steps.release.outputs.pom }}" \
          clean deploy
