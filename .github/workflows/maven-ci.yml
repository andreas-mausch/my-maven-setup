name: Maven CI

on:
  push:
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      MAVEN_OPTS: -Dstyle.color=always -Dorg.slf4j.simpleLogger.showDateTime=true -Dorg.slf4j.simpleLogger.dateTimeFormat=HH:mm:ss,SSS
      MAVEN_CLI_OPTS: >-
        --show-version
        --batch-mode
        --update-snapshots
        --fail-at-end
        --no-transfer-progress
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        fetch-depth: 0

    - name: Set up JDK 8 for JavaCard compilation
      uses: actions/setup-java@v6.0.1
      with:
        distribution: temurin
        java-version: 8
        set-default: false

    - name: Set up JDK 25 with JMODs
      uses: actions/setup-java@v6.0.1
      with:
        distribution: temurin
        java-version: 25
        java-package: jdk+jmods

    - name: Set up JavaCard SDK
      run: |
        mkdir -p "$RUNNER_TEMP/oracle_javacard_sdks"
        cd "$RUNNER_TEMP/oracle_javacard_sdks"
        curl -fsSL https://github.com/martinpaljak/oracle_javacard_sdks/archive/6a75ec0d6913db236d354f154df7dbc9573d976d.tar.gz -o javacard-sdks.tar.gz
        echo "067dc8b7d87130baf02fc57e1e8d5aa531d0a57830039ea82933e421e209f486  javacard-sdks.tar.gz" | sha256sum --check
        tar -xzf javacard-sdks.tar.gz --strip-components=1
        rm javacard-sdks.tar.gz
        ls -la jc305u4_kit/lib/api_classic.jar

    - name: Set up Oracle JavaCard Simulator
      env:
        ORACLE_JAVACARD_SIMULATOR_URL: https://download.oracle.com/otn-pub/java/java_card_kit/3.2/java_card_devkit_simulator-linux-bin-v26.0-b_788-05-MAY-2026.tar.gz
      run: |
        sudo apt-get update
        sudo apt-get install --yes gcc-multilib gpshell pcscd pcsc-tools
        mkdir -p "$RUNNER_TEMP/oracle_javacard_simulator"
        cd "$RUNNER_TEMP/oracle_javacard_simulator"
        curl -fsSL \
          --cookie "oraclelicense=accept-securebackup-cookie" \
          --output java_card_devkit_simulator.tar.gz \
          "$ORACLE_JAVACARD_SIMULATOR_URL"
        echo "b8b999c3e1cfac5d56f7ef16654ce28c99cf472d96761d419a03ddf11f5811c0  java_card_devkit_simulator.tar.gz" | sha256sum --check
        sudo mkdir -p /opt/javacard/simulator
        sudo tar -xzf java_card_devkit_simulator.tar.gz -C /opt/javacard/simulator
        rm java_card_devkit_simulator.tar.gz
        sudo java -jar /opt/javacard/simulator/tools/Configurator.jar \
          -binary /opt/javacard/simulator/runtime/bin/jcsl \
          -SCP-keyset \
            10 \
            404142434445464748494A4B4C4D4E4F \
            404142434445464748494A4B4C4D4E4F \
            404142434445464748494A4B4C4D4E4F \
          -global-pin 01020304050f 03
        curl -fsSL \
          --output "$RUNNER_TEMP/gp.jar" \
          https://github.com/martinpaljak/GlobalPlatformPro/releases/download/v24.10.15/gp.jar
        echo "a68eca9ab9be84a0560b2d312ca6a18cd2dbcd223bb7b30525e0e0f85a372696  $RUNNER_TEMP/gp.jar" | sha256sum --check

    - name: Install Grype
      run: |
        curl -fsSL https://github.com/anchore/grype/releases/download/v0.112.0/grype_0.112.0_linux_amd64.tar.gz -o grype.tar.gz
        echo "acb14a030010fe9bdb9594b4ae108d9d14ef2f926d936aa0916dc62c89c058ea  grype.tar.gz" | sha256sum --check
        tar -xzf grype.tar.gz -C /tmp
        mv /tmp/grype /usr/local/bin/grype
        rm grype.tar.gz
        grype version

    - name: Generate GPG signing key
      env:
        OPENPGP_KEY_BIP39_MNEMONIC: ${{ secrets.OPENPGP_KEY_BIP39_MNEMONIC }}
      run: |
        curl -fsSL https://github.com/jpdarago/bip39key/releases/download/v1.5.2/bip39key-x86_64-unknown-linux-musl.tar.gz -o /tmp/bip39key.tar.gz
        echo "5c9e68a2eeb9456b61aadaacd5402119ab2065fa3046cdd95c93492c52038a4a  /tmp/bip39key.tar.gz" | sha256sum --check
        tar -xzf /tmp/bip39key.tar.gz -C /usr/local/bin/
        mv /usr/local/bin/bip39key-x86_64-unknown-linux-musl /usr/local/bin/bip39key
        echo "$OPENPGP_KEY_BIP39_MNEMONIC" | bip39key --user-id="Maven CI" --armor > ./my-maven-setup-ci-key.asc
        echo "$OPENPGP_KEY_BIP39_MNEMONIC" | bip39key --user-id="Maven CI" --armor --public-key > ./my-maven-setup-ci-key.pub.asc
        gpg --batch --import ./my-maven-setup-ci-key.asc

    - name: Install api_classic.jar to local Maven repository
      run: |
        mvn $MAVEN_CLI_OPTS \
          install:install-file \
          -Dfile="$RUNNER_TEMP/oracle_javacard_sdks/jc305u4_kit/lib/api_classic.jar" \
          -DgroupId=com.oracle.javacard -DartifactId=api-classic \
          -Dversion=3.0.5 -Dpackaging=jar

    - name: Install current build artifacts to local Maven repository
      working-directory: ${{ runner.temp }}
      run: |
        mvn $MAVEN_CLI_OPTS --file "$GITHUB_WORKSPACE/maven-build-config/pom.xml" clean install
        mvn $MAVEN_CLI_OPTS --file "$GITHUB_WORKSPACE/parent-java.xml" clean install
        mvn $MAVEN_CLI_OPTS --file "$GITHUB_WORKSPACE/parent-kotlin.xml" clean install
        mvn $MAVEN_CLI_OPTS --file "$GITHUB_WORKSPACE/parent-javacard.xml" clean install

    - name: Prepare isolated consumer projects
      run: |
        cp --recursive examples/java "$RUNNER_TEMP/java-consumer"
        git -C "$RUNNER_TEMP/java-consumer" init
        git -C "$RUNNER_TEMP/java-consumer" add .
        git -C "$RUNNER_TEMP/java-consumer" \
          -c user.name="Maven CI" \
          -c user.email="ci@example.invalid" \
          commit --message="Initial Java consumer fixture"

        cp --recursive examples/kotlin "$RUNNER_TEMP/kotlin-consumer"
        git -C "$RUNNER_TEMP/kotlin-consumer" init
        git -C "$RUNNER_TEMP/kotlin-consumer" add .
        git -C "$RUNNER_TEMP/kotlin-consumer" \
          -c user.name="Maven CI" \
          -c user.email="ci@example.invalid" \
          commit --message="Initial Kotlin consumer fixture"

        cp --recursive examples/javacard "$RUNNER_TEMP/javacard-consumer"
        git -C "$RUNNER_TEMP/javacard-consumer" init
        git -C "$RUNNER_TEMP/javacard-consumer" add .
        git -C "$RUNNER_TEMP/javacard-consumer" \
          -c user.name="Maven CI" \
          -c user.email="ci@example.invalid" \
          commit --message="Initial JavaCard consumer fixture"

    - name: Build Java example
      working-directory: ${{ runner.temp }}/java-consumer
      run: |
        mvn $MAVEN_CLI_OPTS \
          -Plinting \
          -Psbom \
          -Plicense-check \
          -Pcoverage \
          -Psize-optimization \
          -Psign -Dgpg.key="Maven CI" \
          clean verify

        # Smoke-test the processed artifact; regular tests run against the classes before ProGuard.
        java -jar target/java-example-1.0-SNAPSHOT-proguard.jar \
          src/test-integration/resources/test-people.txt

    - name: Build Kotlin example
      working-directory: ${{ runner.temp }}/kotlin-consumer
      run: |
        mvn $MAVEN_CLI_OPTS \
          -Plinting \
          -Psbom \
          -Plicense-check \
          -Pcoverage \
          -Psign -Dgpg.key="Maven CI" \
          clean verify

    - name: Build JavaCard example
      working-directory: ${{ runner.temp }}/javacard-consumer
      run: |
        mvn $MAVEN_CLI_OPTS \
          -Djava.compiler.main.path=$JAVA_HOME_8_X64/bin/javac \
          -Djavacard.sdk.path="$RUNNER_TEMP/oracle_javacard_sdks/jc305u4_kit" \
          -Plinting \
          -Psbom \
          -Plicense-check \
          -Pcoverage \
          -Psize-optimization \
          -Psign -Dgpg.key="Maven CI" \
          clean verify

    - name: Run JavaCard CAP in Oracle simulator
      run: |
        sudo install -m 644 .github/oracle-javacard-simulator-reader.conf /etc/reader.conf.d/jcsdk.conf
        sudo systemctl stop pcscd.socket pcscd.service || true
        sudo pcscd --foreground --disable-polkit > "$RUNNER_TEMP/pcscd.log" 2>&1 &
        pcscd_pid=$!
        LD_LIBRARY_PATH=/opt/javacard/simulator/runtime/bin \
          /opt/javacard/simulator/runtime/bin/jcsl -p=9025 -log_level=finest \
          > "$RUNNER_TEMP/jcsl.log" 2>&1 &
        simulator_pid=$!
        trap 'kill "$simulator_pid" 2>/dev/null || true; sudo kill "$pcscd_pid" 2>/dev/null || true' EXIT

        card_ready=false
        for attempt in {1..60}; do
          if timeout 2 pcsc_scan -c 2>&1 | grep --quiet --ignore-case --extended-regexp \
            'card present|card inserted|card state:.*present|atr:'; then
            card_ready=true
            break
          fi
          sleep 0.5
        done
        if [ "$card_ready" != true ]; then
          cat "$RUNNER_TEMP/pcscd.log"
          cat "$RUNNER_TEMP/jcsl.log"
          exit 1
        fi

        unset GP_KEY GP_KEY_ENC GP_KEY_MAC GP_KEY_DEK
        java -jar "$RUNNER_TEMP/gp.jar" --install "$RUNNER_TEMP/javacard-consumer/target/010203040506.cap"
        gpshell_output="$(gpshell "$RUNNER_TEMP/javacard-consumer/hello.gpshell")"
        printf '%s\n' "$gpshell_output"
        grep --quiet 'Response <-- 48656C6C6F9000' <<< "$gpshell_output"

    - name: Scan for vulnerabilities
      run: |
        grype sbom:"$RUNNER_TEMP/java-consumer/target/bom.json" --fail-on high
        grype sbom:"$RUNNER_TEMP/kotlin-consumer/target/bom.json" --fail-on high
        grype sbom:"$RUNNER_TEMP/javacard-consumer/target/bom.json" --fail-on high

    - name: Upload Java example artifacts
      uses: actions/upload-artifact@v7.0.1
      with:
        name: java-example-artifacts
        path: |
          ${{ runner.temp }}/java-consumer/target/*.jar
          ${{ runner.temp }}/java-consumer/target/*.pom
          ${{ runner.temp }}/java-consumer/target/*.jar.asc
          ${{ runner.temp }}/java-consumer/target/*.pom.asc
          ${{ runner.temp }}/java-consumer/target/bom.json
          ${{ runner.temp }}/java-consumer/target/site/*.spdx.json
          ${{ runner.temp }}/java-consumer/target/surefire-reports/
          ${{ runner.temp }}/java-consumer/target/failsafe-reports/
          ${{ runner.temp }}/java-consumer/target/site/jacoco/

    - name: Upload Kotlin example artifacts
      uses: actions/upload-artifact@v7.0.1
      with:
        name: kotlin-example-artifacts
        path: |
          ${{ runner.temp }}/kotlin-consumer/target/*.jar
          ${{ runner.temp }}/kotlin-consumer/target/*.pom
          ${{ runner.temp }}/kotlin-consumer/target/*.jar.asc
          ${{ runner.temp }}/kotlin-consumer/target/*.pom.asc
          ${{ runner.temp }}/kotlin-consumer/target/bom.json
          ${{ runner.temp }}/kotlin-consumer/target/site/*.spdx.json
          ${{ runner.temp }}/kotlin-consumer/target/surefire-reports/
          ${{ runner.temp }}/kotlin-consumer/target/failsafe-reports/
          ${{ runner.temp }}/kotlin-consumer/target/site/jacoco/

    - name: Upload JavaCard example artifacts
      uses: actions/upload-artifact@v7.0.1
      with:
        name: javacard-example-artifacts
        path: |
          ${{ runner.temp }}/javacard-consumer/target/*.jar
          ${{ runner.temp }}/javacard-consumer/target/*.cap
          ${{ runner.temp }}/javacard-consumer/target/*.pom
          ${{ runner.temp }}/javacard-consumer/target/*.jar.asc
          ${{ runner.temp }}/javacard-consumer/target/*.cap.asc
          ${{ runner.temp }}/javacard-consumer/target/*.pom.asc
          ${{ runner.temp }}/javacard-consumer/target/bom.json
          ${{ runner.temp }}/javacard-consumer/target/site/*.spdx.json
          ${{ runner.temp }}/javacard-consumer/target/surefire-reports/
          ${{ runner.temp }}/javacard-consumer/target/failsafe-reports/
          ${{ runner.temp }}/javacard-consumer/target/site/jacoco/

    - name: Upload public GPG key
      uses: actions/upload-artifact@v7.0.1
      with:
        name: my-maven-setup-ci-key.pub.asc
        path: my-maven-setup-ci-key.pub.asc
