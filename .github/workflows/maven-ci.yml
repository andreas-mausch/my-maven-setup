name: Maven CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MAVEN_OPTS: -Dstyle.color=always -Dorg.slf4j.simpleLogger.showDateTime=true -Dorg.slf4j.simpleLogger.dateTimeFormat=HH:mm:ss,SSS
      MAVEN_CLI_OPTS: >-
        --show-version
        --batch-mode
        --update-snapshots
        --fail-at-end
        --no-transfer-progress
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Set up JDK 25 (latest LTS) and JDK 8 (for JavaCard compilation)
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: |
          8
          25

    - name: Set up JavaCard SDK
      run: |
        mkdir -p external/oracle_javacard_sdks
        cd external/oracle_javacard_sdks
        curl -fsSL https://github.com/martinpaljak/oracle_javacard_sdks/archive/refs/heads/master.tar.gz -o javacard-sdks.tar.gz
        echo "20d935aa7616fcc689da7cd2a1b793a5c12396a898bffbd27dff36ece7ad1c9b  javacard-sdks.tar.gz" | sha256sum --check
        tar -xzf javacard-sdks.tar.gz --strip-components=1
        rm javacard-sdks.tar.gz
        ls -la jc305u4_kit/lib/api_classic.jar

    - name: Set up Oracle JavaCard Simulator
      env:
        ORACLE_JAVACARD_SIMULATOR_URL: https://download.oracle.com/otn-pub/java/java_card_kit/3.2/java_card_devkit_simulator-linux-bin-v26.0-b_788-05-MAY-2026.tar.gz
      run: |
        mkdir -p external/oracle_javacard_simulator
        cd external/oracle_javacard_simulator
        curl -fsSL \
          --cookie "oraclelicense=accept-securebackup-cookie" \
          --output java_card_devkit_simulator.tar.gz \
          "$ORACLE_JAVACARD_SIMULATOR_URL"
        echo "b8b999c3e1cfac5d56f7ef16654ce28c99cf472d96761d419a03ddf11f5811c0  java_card_devkit_simulator.tar.gz" | sha256sum --check
        tar -xzf java_card_devkit_simulator.tar.gz
        rm java_card_devkit_simulator.tar.gz
        ls -la

    - name: Install Grype
      run: |
        curl -fsSL https://github.com/anchore/grype/releases/download/v0.112.0/grype_0.112.0_linux_amd64.tar.gz -o grype.tar.gz
        echo "acb14a030010fe9bdb9594b4ae108d9d14ef2f926d936aa0916dc62c89c058ea  grype.tar.gz" | sha256sum --check
        tar -xzf grype.tar.gz -C /tmp
        mv /tmp/grype /usr/local/bin/grype
        rm grype.tar.gz
        grype version

    - name: Generate GPG signing key
      env:
        OPENPGP_KEY_BIP39_MNEMONIC: ${{ secrets.OPENPGP_KEY_BIP39_MNEMONIC }}
      run: |
        curl -fsSL https://github.com/jpdarago/bip39key/releases/download/v1.5.2/bip39key-x86_64-unknown-linux-musl.tar.gz -o /tmp/bip39key.tar.gz
        echo "5c9e68a2eeb9456b61aadaacd5402119ab2065fa3046cdd95c93492c52038a4a  /tmp/bip39key.tar.gz" | sha256sum --check
        tar -xzf /tmp/bip39key.tar.gz -C /usr/local/bin/
        mv /usr/local/bin/bip39key-x86_64-unknown-linux-musl /usr/local/bin/bip39key
        echo "$OPENPGP_KEY_BIP39_MNEMONIC" | bip39key --user-id="Maven CI" --armor > ./javacard-openpgp-key.asc
        echo "$OPENPGP_KEY_BIP39_MNEMONIC" | bip39key --user-id="Maven CI" --armor --public-key > ./javacard-openpgp-key.pub.asc
        gpg --batch --import ./javacard-openpgp-key.asc

    - name: Install api_classic.jar to local Maven repository
      run: |
        mvn $MAVEN_CLI_OPTS \
          install:install-file \
          -Dfile=external/oracle_javacard_sdks/jc305u4_kit/lib/api_classic.jar \
          -DgroupId=com.oracle.javacard -DartifactId=api-classic \
          -Dversion=3.0.5 -Dpackaging=jar

    - name: Build Java example
      run: |
        cd examples/java
        mvn $MAVEN_CLI_OPTS \
          -Psbom \
          -Plicense-check \
          -Psign -Dgpg.key="Maven CI" \
          clean verify

    - name: Build JavaCard example
      run: |
        cd examples/javacard
        mvn $MAVEN_CLI_OPTS \
          -Djava.compiler.main.path=$JAVA_HOME_8_X64/bin/javac \
          -Djavacard.sdk.path=$GITHUB_WORKSPACE/external/oracle_javacard_sdks/jc305u4_kit \
          -Psbom \
          -Plicense-check \
          -Psign -Dgpg.key="Maven CI" \
          clean verify

    - name: Scan for vulnerabilities
      run: |
        grype sbom:examples/java/target/bom.json --fail-on high
        grype sbom:examples/javacard/target/bom.json --fail-on high

    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: maven-artifacts
        path: |
          examples/java/target/*.jar
          examples/java/target/*.pom
          examples/java/target/*.jar.asc
          examples/java/target/*.pom.asc
          examples/java/target/bom.json
          examples/java/target/site/*.spdx.json
          examples/javacard/target/*.jar
          examples/javacard/target/*.cap
          examples/javacard/target/*.pom
          examples/javacard/target/*.jar.asc
          examples/javacard/target/*.cap.asc
          examples/javacard/target/*.pom.asc
          examples/javacard/target/bom.json
          examples/javacard/target/site/*.spdx.json
          javacard-openpgp-key.pub.asc
