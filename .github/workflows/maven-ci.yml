name: Maven CI

on:
  push:
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-verify:
    runs-on: ubuntu-24.04
    env:
      MAVEN_OPTS: -Dstyle.color=always -Dorg.slf4j.simpleLogger.showDateTime=true -Dorg.slf4j.simpleLogger.dateTimeFormat=HH:mm:ss,SSS
      MAVEN_CLI_OPTS: >-
        --show-version
        --batch-mode
        --update-snapshots
        --fail-at-end
        --no-transfer-progress
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        fetch-depth: 0

    - name: Set up JDK 8 for JavaCard compilation
      uses: actions/setup-java@v6.0.1
      with:
        distribution: temurin
        java-version: 8
        set-default: false

    - name: Set up JDK 25 with JMODs
      uses: actions/setup-java@v6.0.1
      with:
        distribution: temurin
        java-version: 25
        java-package: jdk+jmods

    - name: Set up JavaCard SDK
      run: |
        mkdir -p "$RUNNER_TEMP/oracle_javacard_sdks"
        cd "$RUNNER_TEMP/oracle_javacard_sdks"
        curl -fsSL https://github.com/martinpaljak/oracle_javacard_sdks/archive/6a75ec0d6913db236d354f154df7dbc9573d976d.tar.gz -o javacard-sdks.tar.gz
        echo "067dc8b7d87130baf02fc57e1e8d5aa531d0a57830039ea82933e421e209f486  javacard-sdks.tar.gz" | sha256sum --check
        tar -xzf javacard-sdks.tar.gz --strip-components=1
        rm javacard-sdks.tar.gz
        ls -la jc305u4_kit/lib/api_classic.jar

    - name: Set up Oracle JavaCard Simulator
      env:
        ORACLE_JAVACARD_SIMULATOR_URL: https://download.oracle.com/otn-pub/java/java_card_kit/3.2/java_card_devkit_simulator-linux-bin-v26.0-b_788-05-MAY-2026.tar.gz
      run: |
        sudo apt-get update
        sudo apt-get install --yes gcc-multilib gpshell pcscd pcsc-tools
        mkdir -p "$RUNNER_TEMP/oracle_javacard_simulator"
        cd "$RUNNER_TEMP/oracle_javacard_simulator"
        curl -fsSL \
          --cookie "oraclelicense=accept-securebackup-cookie" \
          --output java_card_devkit_simulator.tar.gz \
          "$ORACLE_JAVACARD_SIMULATOR_URL"
        echo "b8b999c3e1cfac5d56f7ef16654ce28c99cf472d96761d419a03ddf11f5811c0  java_card_devkit_simulator.tar.gz" | sha256sum --check
        sudo mkdir -p /opt/javacard/simulator
        sudo tar -xzf java_card_devkit_simulator.tar.gz -C /opt/javacard/simulator
        rm java_card_devkit_simulator.tar.gz
        sudo java -jar /opt/javacard/simulator/tools/Configurator.jar \
          -binary /opt/javacard/simulator/runtime/bin/jcsl \
          -SCP-keyset \
            10 \
            404142434445464748494A4B4C4D4E4F \
            404142434445464748494A4B4C4D4E4F \
            404142434445464748494A4B4C4D4E4F \
          -global-pin 01020304050f 03
        curl -fsSL \
          --output "$RUNNER_TEMP/gp.jar" \
          https://github.com/martinpaljak/GlobalPlatformPro/releases/download/v24.10.15/gp.jar
        echo "a68eca9ab9be84a0560b2d312ca6a18cd2dbcd223bb7b30525e0e0f85a372696  $RUNNER_TEMP/gp.jar" | sha256sum --check

    - name: Install Grype
      run: |
        curl -fsSL https://github.com/anchore/grype/releases/download/v0.112.0/grype_0.112.0_linux_amd64.tar.gz -o grype.tar.gz
        echo "acb14a030010fe9bdb9594b4ae108d9d14ef2f926d936aa0916dc62c89c058ea  grype.tar.gz" | sha256sum --check
        tar -xzf grype.tar.gz -C /tmp
        mv /tmp/grype /usr/local/bin/grype
        rm grype.tar.gz
        grype version

    - name: Generate GPG signing key
      env:
        OPENPGP_KEY_BIP39_MNEMONIC: ${{ secrets.OPENPGP_KEY_BIP39_MNEMONIC }}
      run: |
        curl -fsSL https://github.com/jpdarago/bip39key/releases/download/v1.5.2/bip39key-x86_64-unknown-linux-musl.tar.gz -o /tmp/bip39key.tar.gz
        echo "5c9e68a2eeb9456b61aadaacd5402119ab2065fa3046cdd95c93492c52038a4a  /tmp/bip39key.tar.gz" | sha256sum --check
        tar -xzf /tmp/bip39key.tar.gz -C /usr/local/bin/
        mv /usr/local/bin/bip39key-x86_64-unknown-linux-musl /usr/local/bin/bip39key
        echo "$OPENPGP_KEY_BIP39_MNEMONIC" | bip39key --user-id="Maven CI" --armor > ./my-maven-setup-ci-key.asc
        echo "$OPENPGP_KEY_BIP39_MNEMONIC" | bip39key --user-id="Maven CI" --armor --public-key > ./my-maven-setup-ci-key.pub.asc
        gpg --batch --import ./my-maven-setup-ci-key.asc

    - name: Install api_classic.jar to local Maven repository
      run: |
        mvn $MAVEN_CLI_OPTS \
          install:install-file \
          -Dfile="$RUNNER_TEMP/oracle_javacard_sdks/jc305u4_kit/lib/api_classic.jar" \
          -DgroupId=com.oracle.javacard -DartifactId=api-classic \
          -Dversion=3.0.5 -Dpackaging=jar

    - name: Install current build artifacts to local Maven repository
      working-directory: ${{ runner.temp }}
      run: |
        mvn $MAVEN_CLI_OPTS --file "$GITHUB_WORKSPACE/maven-build-config/pom.xml" clean install
        mvn $MAVEN_CLI_OPTS --file "$GITHUB_WORKSPACE/parent-java.xml" clean install
        mvn $MAVEN_CLI_OPTS --file "$GITHUB_WORKSPACE/parent-kotlin.xml" clean install
        mvn $MAVEN_CLI_OPTS --file "$GITHUB_WORKSPACE/parent-javacard.xml" clean install

    - name: Prepare isolated consumer projects
      run: |
        mkdir "$RUNNER_TEMP/consumer-fixtures"
        cp --recursive examples/java "$RUNNER_TEMP/consumer-fixtures/java-consumer"
        cp --recursive examples/kotlin "$RUNNER_TEMP/consumer-fixtures/kotlin-consumer"
        cp --recursive examples/javacard "$RUNNER_TEMP/consumer-fixtures/javacard-consumer"

        git -C "$RUNNER_TEMP/consumer-fixtures" init
        git -C "$RUNNER_TEMP/consumer-fixtures" add .
        git -C "$RUNNER_TEMP/consumer-fixtures" \
          -c user.name="Maven CI" \
          -c user.email="ci@example.invalid" \
          commit --message="Initial consumer fixtures"

    - name: Prepare negative consumer fixtures
      run: |
        cp --recursive .github/fixtures/negative \
          "$RUNNER_TEMP/negative-consumer-fixtures"

    - name: Reject size optimization without main class
      working-directory: ${{ runner.temp }}/negative-consumer-fixtures/missing-main-class
      run: |
        log_file="$RUNNER_TEMP/missing-main-class.log"
        if mvn $MAVEN_CLI_OPTS -Psize-optimization validate > "$log_file" 2>&1; then
          cat "$log_file"
          exit 1
        fi
        cat "$log_file"
        grep --fixed-strings --quiet \
          'You must define <main.class> to build an executable ProGuard JAR.' \
          "$log_file"

    - name: Reject JavaCard build without applet ID
      working-directory: ${{ runner.temp }}/negative-consumer-fixtures/missing-javacard-property
      run: |
        log_file="$RUNNER_TEMP/missing-applet-id.log"
        if mvn $MAVEN_CLI_OPTS \
          -Djava.compiler.main.path=/unused \
          -Djavacard.sdk.path=/unused \
          validate > "$log_file" 2>&1; then
          cat "$log_file"
          exit 1
        fi
        cat "$log_file"
        grep --fixed-strings --quiet \
          'You must define <applet.id> in your project POM (e.g.' \
          "$log_file"

    - name: Reject JavaCard build without Java compiler path
      working-directory: ${{ runner.temp }}/negative-consumer-fixtures/missing-javacard-property
      run: |
        log_file="$RUNNER_TEMP/missing-java-compiler-path.log"
        if mvn $MAVEN_CLI_OPTS \
          -Dapplet.id=01:02:03:04:05:06 \
          -Djavacard.sdk.path=/unused \
          validate > "$log_file" 2>&1; then
          cat "$log_file"
          exit 1
        fi
        cat "$log_file"
        grep --fixed-strings --quiet \
          'You must specify the JDK 8 javac path via' \
          "$log_file"

    - name: Reject JavaCard build without SDK path
      working-directory: ${{ runner.temp }}/negative-consumer-fixtures/missing-javacard-property
      run: |
        log_file="$RUNNER_TEMP/missing-javacard-sdk-path.log"
        if mvn $MAVEN_CLI_OPTS \
          -Dapplet.id=01:02:03:04:05:06 \
          -Djava.compiler.main.path=/unused \
          validate > "$log_file" 2>&1; then
          cat "$log_file"
          exit 1
        fi
        cat "$log_file"
        grep --fixed-strings --quiet \
          'You must specify the JavaCard SDK path via' \
          "$log_file"

    - name: Reject dependency with disallowed license
      working-directory: ${{ runner.temp }}/negative-consumer-fixtures/disallowed-license
      run: |
        log_file="$RUNNER_TEMP/disallowed-license.log"
        if mvn $MAVEN_CLI_OPTS -Plicense-check verify > "$log_file" 2>&1; then
          cat "$log_file"
          exit 1
        fi
        cat "$log_file"
        grep --fixed-strings --quiet \
          'There are some forbidden licenses used, please check your dependencies.' \
          "$log_file"
        grep --fixed-strings --null-data --quiet \
          $'[WARNING] License: \'The GNU General Public License, v2 with Universal FOSS Exception, v1.0\' used by 1 dependencies:\n -MySQL Connector/J (com.mysql:mysql-connector-j:8.0.33 - http://dev.mysql.com/doc/connector-j/en/)' \
          "$log_file"

    - name: Reject Java format violation
      working-directory: ${{ runner.temp }}/negative-consumer-fixtures/format-violation
      run: |
        log_file="$RUNNER_TEMP/format-violation.log"
        if mvn $MAVEN_CLI_OPTS -Plinting validate > "$log_file" 2>&1; then
          cat "$log_file"
          exit 1
        fi
        cat "$log_file"
        grep --fixed-strings --null-data --quiet \
          $'The following files had format violations:\n[ERROR]     src/main/java/FormatViolation.java' \
          "$log_file"

    - name: Reject unsupported Java version
      working-directory: ${{ runner.temp }}/negative-consumer-fixtures/unsupported-java-version
      run: |
        log_file="$RUNNER_TEMP/unsupported-java-version.log"
        if JAVA_HOME="$JAVA_HOME_8_X64" mvn $MAVEN_CLI_OPTS validate > "$log_file" 2>&1; then
          cat "$log_file"
          exit 1
        fi
        cat "$log_file"
        grep --extended-regexp --line-regexp --quiet \
          '\[ERROR\] Detected JDK .+ is version 1\.8[^ ]* which is not in the allowed range \[25,\)\.' \
          "$log_file"

    - name: Build Java example
      working-directory: ${{ runner.temp }}/consumer-fixtures/java-consumer
      run: |
        mvn $MAVEN_CLI_OPTS \
          -Plinting \
          -Psbom \
          -Plicense-check \
          -Pcoverage \
          -Psize-optimization \
          -Psign -Dgpg.key="Maven CI" \
          clean verify

    - name: Build Kotlin example
      working-directory: ${{ runner.temp }}/consumer-fixtures/kotlin-consumer
      run: |
        mvn $MAVEN_CLI_OPTS \
          -Plinting \
          -Psbom \
          -Plicense-check \
          -Pcoverage \
          -Psize-optimization \
          -Psign -Dgpg.key="Maven CI" \
          clean verify

    - name: Build JavaCard example
      working-directory: ${{ runner.temp }}/consumer-fixtures/javacard-consumer
      run: |
        mvn $MAVEN_CLI_OPTS \
          -Djava.compiler.main.path=$JAVA_HOME_8_X64/bin/javac \
          -Djavacard.sdk.path="$RUNNER_TEMP/oracle_javacard_sdks/jc305u4_kit" \
          -Plinting \
          -Psbom \
          -Plicense-check \
          -Pcoverage \
          -Psize-optimization \
          -Psign -Dgpg.key="Maven CI" \
          clean verify

    - name: Verify test and coverage reports
      run: |
        pattern='^Tests run: [1-9][0-9]*, Failures: 0, Errors: 0, Skipped: 0'
        for name in java kotlin javacard; do
          directory="$RUNNER_TEMP/consumer-fixtures/$name-consumer"
          for report in "$directory"/target/surefire-reports/*.txt; do
            grep -q "$pattern" "$report"
          done
          for report in "$directory"/target/failsafe-reports/*.txt; do
            grep -q "$pattern" "$report"
          done
          test -s "$directory/target/site/jacoco/jacoco.csv"
        done

    - name: Validate SBOM schemas
      run: |
        python -m pip install --disable-pip-version-check check-jsonschema==0.37.0
        check-jsonschema \
          --schemafile https://raw.githubusercontent.com/CycloneDX/specification/1.6/schema/bom-1.6.schema.json \
          "$RUNNER_TEMP/consumer-fixtures/java-consumer/target/java-example-1.0.0-SNAPSHOT.sbom.cyclonedx.json" \
          "$RUNNER_TEMP/consumer-fixtures/kotlin-consumer/target/kotlin-example-1.0.0-SNAPSHOT.sbom.cyclonedx.json" \
          "$RUNNER_TEMP/consumer-fixtures/javacard-consumer/target/javacard-hello-world-1.0-SNAPSHOT.sbom.cyclonedx.json"
        check-jsonschema \
          --schemafile https://raw.githubusercontent.com/spdx/spdx-spec/v2.3/schemas/spdx-schema.json \
          "$RUNNER_TEMP/consumer-fixtures/java-consumer/target/java-example-1.0.0-SNAPSHOT.sbom.spdx.json" \
          "$RUNNER_TEMP/consumer-fixtures/kotlin-consumer/target/kotlin-example-1.0.0-SNAPSHOT.sbom.spdx.json" \
          "$RUNNER_TEMP/consumer-fixtures/javacard-consumer/target/javacard-hello-world-1.0-SNAPSHOT.sbom.spdx.json"

    - name: Verify executable JARs
      run: |
        java_revision="$(git -C "$RUNNER_TEMP/consumer-fixtures/java-consumer" \
          describe --tags --always --dirty=-dirty)"
        kotlin_revision="$(git -C "$RUNNER_TEMP/consumer-fixtures/kotlin-consumer" \
          describe --tags --always --dirty=-dirty)"
        java_shaded_jar="$RUNNER_TEMP/consumer-fixtures/java-consumer/target/java-example-$java_revision.jar"
        java_proguard_jar="$RUNNER_TEMP/consumer-fixtures/java-consumer/target/java-example-$java_revision-proguard.jar"
        kotlin_shaded_jar="$RUNNER_TEMP/consumer-fixtures/kotlin-consumer/target/kotlin-example-$kotlin_revision.jar"
        kotlin_proguard_jar="$RUNNER_TEMP/consumer-fixtures/kotlin-consumer/target/kotlin-example-$kotlin_revision-proguard.jar"
        java_input="$RUNNER_TEMP/consumer-fixtures/java-consumer/src/test-integration/resources/test-people.txt"
        kotlin_input="$RUNNER_TEMP/consumer-fixtures/kotlin-consumer/src/test-integration/resources/test-people.txt"

        test -f "$java_shaded_jar"
        test -f "$java_proguard_jar"
        test -f "$kotlin_shaded_jar"
        test -f "$kotlin_proguard_jar"

        expected_output=$'Found 4 person(s):\n  John Doe\n  Jane Smith\n  John von Neumann\n  Bob Brown'
        java_output="$(java -jar "$java_shaded_jar" "$java_input")"
        java_proguard_output="$(java -jar "$java_proguard_jar" "$java_input")"
        kotlin_output="$(java -jar "$kotlin_shaded_jar" "$kotlin_input")"
        kotlin_proguard_output="$(java -jar "$kotlin_proguard_jar" "$kotlin_input")"

        test "$java_output" = "$expected_output"
        test "$java_proguard_output" = "$expected_output"
        test "$kotlin_output" = "$expected_output"
        test "$kotlin_proguard_output" = "$expected_output"

        for shaded_jar in "$java_shaded_jar" "$kotlin_shaded_jar"; do
          if jar --list --file "$shaded_jar" \
            | grep --extended-regexp '(^|/)module-info\.class$|^META-INF/.*\.(SF|DSA|RSA)$'; then
            exit 1
          fi
        done

    - name: Verify GPG signatures
      run: |
        verification_home="$RUNNER_TEMP/gpg-verification"
        mkdir --mode=700 "$verification_home"
        gpg --batch --homedir "$verification_home" --import my-maven-setup-ci-key.pub.asc

        java_revision="$(git -C "$RUNNER_TEMP/consumer-fixtures/java-consumer" \
          describe --tags --always --dirty=-dirty)"
        kotlin_revision="$(git -C "$RUNNER_TEMP/consumer-fixtures/kotlin-consumer" \
          describe --tags --always --dirty=-dirty)"
        signed_artifacts=(
          "$RUNNER_TEMP/consumer-fixtures/java-consumer/target/java-example-1.0.0-SNAPSHOT.jar"
          "$RUNNER_TEMP/consumer-fixtures/java-consumer/target/java-example-$java_revision-proguard.jar"
          "$RUNNER_TEMP/consumer-fixtures/java-consumer/target/java-example-1.0.0-SNAPSHOT.pom"
          "$RUNNER_TEMP/consumer-fixtures/kotlin-consumer/target/kotlin-example-1.0.0-SNAPSHOT.jar"
          "$RUNNER_TEMP/consumer-fixtures/kotlin-consumer/target/kotlin-example-$kotlin_revision-proguard.jar"
          "$RUNNER_TEMP/consumer-fixtures/kotlin-consumer/target/kotlin-example-1.0.0-SNAPSHOT.pom"
          "$RUNNER_TEMP/consumer-fixtures/javacard-consumer/target/javacard-hello-world-1.0-SNAPSHOT.jar"
          "$RUNNER_TEMP/consumer-fixtures/javacard-consumer/target/010203040506.cap"
          "$RUNNER_TEMP/consumer-fixtures/javacard-consumer/target/javacard-hello-world-1.0-SNAPSHOT.pom"
        )

        for artifact in "${signed_artifacts[@]}"; do
          test -f "$artifact"
          test -f "$artifact.asc"
          gpg --batch --homedir "$verification_home" --verify "$artifact.asc" "$artifact"
        done

    - name: Run JavaCard CAP in Oracle simulator
      run: |
        sudo install -m 644 .github/oracle-javacard-simulator-reader.conf /etc/reader.conf.d/jcsdk.conf
        sudo systemctl stop pcscd.socket pcscd.service || true
        sudo pcscd --foreground --disable-polkit > "$RUNNER_TEMP/pcscd.log" 2>&1 &
        pcscd_pid=$!
        LD_LIBRARY_PATH=/opt/javacard/simulator/runtime/bin \
          /opt/javacard/simulator/runtime/bin/jcsl -p=9025 -log_level=finest \
          > "$RUNNER_TEMP/jcsl.log" 2>&1 &
        simulator_pid=$!
        trap 'kill "$simulator_pid" 2>/dev/null || true; sudo kill "$pcscd_pid" 2>/dev/null || true' EXIT

        card_ready=false
        for attempt in {1..60}; do
          if timeout 2 pcsc_scan -c 2>&1 | grep --quiet --ignore-case --extended-regexp \
            'card present|card inserted|card state:.*present|atr:'; then
            card_ready=true
            break
          fi
          sleep 0.5
        done
        if [ "$card_ready" != true ]; then
          cat "$RUNNER_TEMP/pcscd.log"
          cat "$RUNNER_TEMP/jcsl.log"
          exit 1
        fi

        unset GP_KEY GP_KEY_ENC GP_KEY_MAC GP_KEY_DEK
        java -jar "$RUNNER_TEMP/gp.jar" --install "$RUNNER_TEMP/consumer-fixtures/javacard-consumer/target/010203040506.cap"
        gpshell_output="$(gpshell "$RUNNER_TEMP/consumer-fixtures/javacard-consumer/hello.gpshell")"
        printf '%s\n' "$gpshell_output"
        grep --quiet 'Response <-- 48656C6C6F9000' <<< "$gpshell_output"

    - name: Scan for vulnerabilities
      run: |
        grype sbom:"$RUNNER_TEMP/consumer-fixtures/java-consumer/target/java-example-1.0.0-SNAPSHOT.sbom.cyclonedx.json" --fail-on high
        grype sbom:"$RUNNER_TEMP/consumer-fixtures/kotlin-consumer/target/kotlin-example-1.0.0-SNAPSHOT.sbom.cyclonedx.json" --fail-on high
        grype sbom:"$RUNNER_TEMP/consumer-fixtures/javacard-consumer/target/javacard-hello-world-1.0-SNAPSHOT.sbom.cyclonedx.json" --fail-on high

    - name: Upload Java example artifacts
      uses: actions/upload-artifact@v7.0.1
      with:
        name: java-example-artifacts
        if-no-files-found: error
        path: |
          ${{ runner.temp }}/consumer-fixtures/java-consumer/target/*.jar
          ${{ runner.temp }}/consumer-fixtures/java-consumer/target/*.pom
          ${{ runner.temp }}/consumer-fixtures/java-consumer/target/*.jar.asc
          ${{ runner.temp }}/consumer-fixtures/java-consumer/target/*.pom.asc
          ${{ runner.temp }}/consumer-fixtures/java-consumer/target/java-example-1.0.0-SNAPSHOT.sbom.cyclonedx.json
          ${{ runner.temp }}/consumer-fixtures/java-consumer/target/java-example-1.0.0-SNAPSHOT.sbom.spdx.json
          ${{ runner.temp }}/consumer-fixtures/java-consumer/target/surefire-reports/
          ${{ runner.temp }}/consumer-fixtures/java-consumer/target/failsafe-reports/
          ${{ runner.temp }}/consumer-fixtures/java-consumer/target/site/jacoco/

    - name: Upload Kotlin example artifacts
      uses: actions/upload-artifact@v7.0.1
      with:
        name: kotlin-example-artifacts
        if-no-files-found: error
        path: |
          ${{ runner.temp }}/consumer-fixtures/kotlin-consumer/target/*.jar
          ${{ runner.temp }}/consumer-fixtures/kotlin-consumer/target/*.pom
          ${{ runner.temp }}/consumer-fixtures/kotlin-consumer/target/*.jar.asc
          ${{ runner.temp }}/consumer-fixtures/kotlin-consumer/target/*.pom.asc
          ${{ runner.temp }}/consumer-fixtures/kotlin-consumer/target/kotlin-example-1.0.0-SNAPSHOT.sbom.cyclonedx.json
          ${{ runner.temp }}/consumer-fixtures/kotlin-consumer/target/kotlin-example-1.0.0-SNAPSHOT.sbom.spdx.json
          ${{ runner.temp }}/consumer-fixtures/kotlin-consumer/target/surefire-reports/
          ${{ runner.temp }}/consumer-fixtures/kotlin-consumer/target/failsafe-reports/
          ${{ runner.temp }}/consumer-fixtures/kotlin-consumer/target/site/jacoco/

    - name: Upload JavaCard example artifacts
      uses: actions/upload-artifact@v7.0.1
      with:
        name: javacard-example-artifacts
        if-no-files-found: error
        path: |
          ${{ runner.temp }}/consumer-fixtures/javacard-consumer/target/*.jar
          ${{ runner.temp }}/consumer-fixtures/javacard-consumer/target/*.cap
          ${{ runner.temp }}/consumer-fixtures/javacard-consumer/target/*.pom
          ${{ runner.temp }}/consumer-fixtures/javacard-consumer/target/*.jar.asc
          ${{ runner.temp }}/consumer-fixtures/javacard-consumer/target/*.cap.asc
          ${{ runner.temp }}/consumer-fixtures/javacard-consumer/target/*.pom.asc
          ${{ runner.temp }}/consumer-fixtures/javacard-consumer/target/javacard-hello-world-1.0-SNAPSHOT.sbom.cyclonedx.json
          ${{ runner.temp }}/consumer-fixtures/javacard-consumer/target/javacard-hello-world-1.0-SNAPSHOT.sbom.spdx.json
          ${{ runner.temp }}/consumer-fixtures/javacard-consumer/target/surefire-reports/
          ${{ runner.temp }}/consumer-fixtures/javacard-consumer/target/failsafe-reports/
          ${{ runner.temp }}/consumer-fixtures/javacard-consumer/target/site/jacoco/

    - name: Upload public GPG key
      uses: actions/upload-artifact@v7.0.1
      with:
        name: my-maven-setup-ci-key.pub.asc
        if-no-files-found: error
        path: my-maven-setup-ci-key.pub.asc
