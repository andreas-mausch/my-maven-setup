name: Maven CI

on:
  push:
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-verify:
    name: Build and verify (${{ matrix.example }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
        - example: java
          artifact: java-example
          version: 1.0.0-SNAPSHOT
          verification: executable
        - example: kotlin
          artifact: kotlin-example
          version: 1.0.0-SNAPSHOT
          verification: executable
        - example: kotlin-micronaut
          artifact: kotlin-micronaut-example
          version: 1.0.0-SNAPSHOT
          verification: manifest
        - example: javacard
          artifact: javacard-hello-world
          version: 1.0-SNAPSHOT
          verification: cap
    env:
      MAVEN_OPTS: -Dstyle.color=always -Dorg.slf4j.simpleLogger.showDateTime=true -Dorg.slf4j.simpleLogger.dateTimeFormat=HH:mm:ss,SSS
      MAVEN_CLI_OPTS: >-
        --show-version
        --batch-mode
        --fail-at-end
        --no-transfer-progress
        -Dmicronaut.test.resources.container-log-level=WARN
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        fetch-depth: 0

    - name: Set up JDK 8
      if: matrix.example == 'java' || matrix.verification == 'cap'
      uses: actions/setup-java@v6.0.1
      with:
        distribution: temurin
        java-version: 8
        set-default: false

    - name: Set up JDK 25 with JMODs
      uses: actions/setup-java@v6.0.1
      with:
        distribution: temurin
        java-version: 25
        java-package: jdk+jmods
        cache: maven
        cache-dependency-path: |
          maven-build-config/pom.xml
          parent-java.xml
          parent-kotlin.xml
          parent-kotlin-micronaut.xml
          parent-javacard.xml
          examples/**/pom.xml

    - name: Set up JavaCard environment
      if: matrix.verification == 'cap'
      uses: ./.github/actions/setup-javacard

    - name: Download Grype
      uses: ./.github/actions/cached-download
      with:
        path: ${{ github.workspace }}/.cache/tools/grype.tar.gz
        url: https://github.com/anchore/grype/releases/download/v0.112.0/grype_0.112.0_linux_amd64.tar.gz
        sha256: acb14a030010fe9bdb9594b4ae108d9d14ef2f926d936aa0916dc62c89c058ea

    - name: Install Grype
      run: |
        tar -xzf "$GITHUB_WORKSPACE/.cache/tools/grype.tar.gz" -C /tmp
        mv /tmp/grype /usr/local/bin/grype
        grype version

    - name: Determine Grype database cache key
      id: grype-cache-key
      run: echo "week=$(date --utc +%G-%V)" >> "$GITHUB_OUTPUT"

    - name: Cache Grype database
      uses: actions/cache@v6.1.0
      with:
        path: ~/.cache/grype/db
        key: grype-db-v0.112.0-${{ runner.os }}-${{ steps.grype-cache-key.outputs.week }}
        restore-keys: |
          grype-db-v0.112.0-${{ runner.os }}-

    - name: Download bip39key
      uses: ./.github/actions/cached-download
      with:
        path: ${{ github.workspace }}/.cache/tools/bip39key.tar.gz
        url: https://github.com/jpdarago/bip39key/releases/download/v1.5.2/bip39key-x86_64-unknown-linux-musl.tar.gz
        sha256: 5c9e68a2eeb9456b61aadaacd5402119ab2065fa3046cdd95c93492c52038a4a

    - name: Generate GPG signing key
      env:
        OPENPGP_KEY_BIP39_MNEMONIC: ${{ secrets.OPENPGP_KEY_BIP39_MNEMONIC }}
      run: |
        tar -xzf "$GITHUB_WORKSPACE/.cache/tools/bip39key.tar.gz" -C /usr/local/bin/
        mv /usr/local/bin/bip39key-x86_64-unknown-linux-musl /usr/local/bin/bip39key
        echo "$OPENPGP_KEY_BIP39_MNEMONIC" | bip39key --user-id="Maven CI" --armor > ./my-maven-setup-ci-key.asc
        echo "$OPENPGP_KEY_BIP39_MNEMONIC" | bip39key --user-id="Maven CI" --armor --public-key > ./my-maven-setup-ci-key.pub.asc
        gpg --batch --import ./my-maven-setup-ci-key.asc

    - name: Install current build artifacts to local Maven repository
      working-directory: ${{ runner.temp }}
      run: |
        mvn $MAVEN_CLI_OPTS --file "$GITHUB_WORKSPACE/maven-build-config/pom.xml" clean install
        mvn $MAVEN_CLI_OPTS --file "$GITHUB_WORKSPACE/parent-java.xml" clean install
        mvn $MAVEN_CLI_OPTS --file "$GITHUB_WORKSPACE/parent-kotlin.xml" clean install
        mvn $MAVEN_CLI_OPTS --file "$GITHUB_WORKSPACE/parent-kotlin-micronaut.xml" clean install
        mvn $MAVEN_CLI_OPTS --file "$GITHUB_WORKSPACE/parent-javacard.xml" clean install

    - name: Prepare isolated consumer projects
      run: |
        mkdir "$RUNNER_TEMP/consumer-fixtures"
        cp --recursive examples/java "$RUNNER_TEMP/consumer-fixtures/java-consumer"
        cp --recursive examples/kotlin "$RUNNER_TEMP/consumer-fixtures/kotlin-consumer"
        cp --recursive examples/kotlin-micronaut "$RUNNER_TEMP/consumer-fixtures/kotlin-micronaut-consumer"
        cp --recursive examples/javacard "$RUNNER_TEMP/consumer-fixtures/javacard-consumer"

        git -C "$RUNNER_TEMP/consumer-fixtures" init
        git -C "$RUNNER_TEMP/consumer-fixtures" add .
        git -C "$RUNNER_TEMP/consumer-fixtures" \
          -c user.name="Maven CI" \
          -c user.email="ci@example.invalid" \
          commit --message="Initial consumer fixtures"

    - name: Prepare negative consumer fixtures
      if: matrix.example == 'java'
      run: |
        mkdir --parents "$RUNNER_TEMP/negative-consumer-fixtures/.github/fixtures"
        cp --recursive .github/fixtures/negative \
          "$RUNNER_TEMP/negative-consumer-fixtures/.github/fixtures/negative"
        cp parent-java.xml parent-javacard.xml \
          "$RUNNER_TEMP/negative-consumer-fixtures"

    - name: Reject size optimization without main class
      if: matrix.example == 'java'
      working-directory: ${{ runner.temp }}/negative-consumer-fixtures/.github/fixtures/negative/missing-main-class
      run: |
        log_file="$RUNNER_TEMP/missing-main-class.log"
        if mvn $MAVEN_CLI_OPTS -Psize-optimization validate > "$log_file" 2>&1; then
          cat "$log_file"
          exit 1
        fi
        cat "$log_file"
        grep --fixed-strings --quiet \
          'You must define <main.class> to build an executable ProGuard JAR.' \
          "$log_file"

    - name: Reject JavaCard build without applet ID
      if: matrix.example == 'java'
      working-directory: ${{ runner.temp }}/negative-consumer-fixtures/.github/fixtures/negative/missing-javacard-property
      run: |
        log_file="$RUNNER_TEMP/missing-applet-id.log"
        if mvn $MAVEN_CLI_OPTS \
          -Djava.compiler.main.path=/unused \
          -Djavacard.sdk.path=/unused \
          validate > "$log_file" 2>&1; then
          cat "$log_file"
          exit 1
        fi
        cat "$log_file"
        grep --fixed-strings --quiet \
          'You must define <applet.id> in your project POM (e.g.' \
          "$log_file"

    - name: Reject JavaCard build without Java compiler path
      if: matrix.example == 'java'
      working-directory: ${{ runner.temp }}/negative-consumer-fixtures/.github/fixtures/negative/missing-javacard-property
      run: |
        log_file="$RUNNER_TEMP/missing-java-compiler-path.log"
        if mvn $MAVEN_CLI_OPTS \
          -Dapplet.id=01:02:03:04:05:06 \
          -Djavacard.sdk.path=/unused \
          validate > "$log_file" 2>&1; then
          cat "$log_file"
          exit 1
        fi
        cat "$log_file"
        grep --fixed-strings --quiet \
          'You must specify the JDK 8 javac path via' \
          "$log_file"

    - name: Reject JavaCard build without SDK path
      if: matrix.example == 'java'
      working-directory: ${{ runner.temp }}/negative-consumer-fixtures/.github/fixtures/negative/missing-javacard-property
      run: |
        log_file="$RUNNER_TEMP/missing-javacard-sdk-path.log"
        if mvn $MAVEN_CLI_OPTS \
          -Dapplet.id=01:02:03:04:05:06 \
          -Djava.compiler.main.path=/unused \
          validate > "$log_file" 2>&1; then
          cat "$log_file"
          exit 1
        fi
        cat "$log_file"
        grep --fixed-strings --quiet \
          'You must specify the JavaCard SDK path via' \
          "$log_file"

    - name: Reject dependency with disallowed license
      if: matrix.example == 'java'
      working-directory: ${{ runner.temp }}/negative-consumer-fixtures/.github/fixtures/negative/disallowed-license
      run: |
        log_file="$RUNNER_TEMP/disallowed-license.log"
        if mvn $MAVEN_CLI_OPTS -Plicense-check verify > "$log_file" 2>&1; then
          cat "$log_file"
          exit 1
        fi
        cat "$log_file"
        grep --fixed-strings --quiet \
          'There are some forbidden licenses used, please check your dependencies.' \
          "$log_file"
        grep --fixed-strings --null-data --quiet \
          $'[WARNING] License: \'The GNU General Public License, v2 with Universal FOSS Exception, v1.0\' used by 1 dependencies:\n -MySQL Connector/J (com.mysql:mysql-connector-j:8.0.33 - http://dev.mysql.com/doc/connector-j/en/)' \
          "$log_file"

    - name: Reject Java format violation
      if: matrix.example == 'java'
      working-directory: ${{ runner.temp }}/negative-consumer-fixtures/.github/fixtures/negative/format-violation
      run: |
        log_file="$RUNNER_TEMP/format-violation.log"
        if mvn $MAVEN_CLI_OPTS -Plinting validate > "$log_file" 2>&1; then
          cat "$log_file"
          exit 1
        fi
        cat "$log_file"
        grep --fixed-strings --null-data --quiet \
          $'The following files had format violations:\n[ERROR]     src/main/java/FormatViolation.java' \
          "$log_file"

    - name: Reject unsupported Java version
      if: matrix.example == 'java'
      working-directory: ${{ runner.temp }}/negative-consumer-fixtures/.github/fixtures/negative/unsupported-java-version
      run: |
        log_file="$RUNNER_TEMP/unsupported-java-version.log"
        if JAVA_HOME="$JAVA_HOME_8_X64" mvn $MAVEN_CLI_OPTS validate > "$log_file" 2>&1; then
          cat "$log_file"
          exit 1
        fi
        cat "$log_file"
        grep --extended-regexp --quiet \
          '\[ERROR\] Detected JDK .+ is version 1\.8[^ ]* which is not in the allowed range \[25,\)\.' \
          "$log_file"

    - name: Build example
      working-directory: ${{ runner.temp }}/consumer-fixtures/${{ matrix.example }}-consumer
      run: |
        if [ "${{ matrix.verification }}" = cap ]; then
          javacard_options=(
            "-Djava.compiler.main.path=$JAVA_HOME_8_X64/bin/javac"
            "-Djavacard.sdk.path=$RUNNER_TEMP/oracle_javacard_sdks/jc305u4_kit"
          )
        else
          javacard_options=()
        fi
        mvn $MAVEN_CLI_OPTS \
          "${javacard_options[@]}" \
          -Plinting \
          -Psbom \
          -Plicense-check \
          -Pcoverage \
          -Psize-optimization \
          -Psign -Dgpg.key="Maven CI" \
          clean verify

    - name: Verify test and coverage reports
      run: |
        pattern='^Tests run: [1-9][0-9]*, Failures: 0, Errors: 0, Skipped: 0'
        directory="$RUNNER_TEMP/consumer-fixtures/${{ matrix.example }}-consumer"
        for report in "$directory"/target/surefire-reports/*.txt; do
          grep -q "$pattern" "$report"
        done
        for report in "$directory"/target/failsafe-reports/*.txt; do
          grep -q "$pattern" "$report"
        done
        test -s "$directory/target/site/jacoco/jacoco.csv"

    - name: Validate SBOM schemas
      run: |
        directory="$RUNNER_TEMP/consumer-fixtures/${{ matrix.example }}-consumer"
        revision="$(git -C "$directory" describe --tags --always --dirty=-dirty)"
        artifact="${{ matrix.artifact }}-$revision"
        python -m pip install --disable-pip-version-check check-jsonschema==0.37.0
        check-jsonschema \
          --schemafile https://raw.githubusercontent.com/CycloneDX/specification/1.6/schema/bom-1.6.schema.json \
          "$directory/target/$artifact.sbom.cyclonedx.json"
        check-jsonschema \
          --schemafile https://raw.githubusercontent.com/spdx/spdx-spec/v2.3/schemas/spdx-schema.json \
          "$directory/target/$artifact.sbom.spdx.json"

    - name: Verify executable JARs
      if: matrix.verification == 'executable'
      run: |
        directory="$RUNNER_TEMP/consumer-fixtures/${{ matrix.example }}-consumer"
        revision="$(git -C "$directory" \
          describe --tags --always --dirty=-dirty)"
        shaded_jar="$directory/target/${{ matrix.artifact }}-$revision.jar"
        proguard_jar="$directory/target/${{ matrix.artifact }}-$revision-proguard.jar"
        test -f "$shaded_jar"
        test -f "$proguard_jar"

        input="$directory/src/test-integration/resources/test-people.txt"
        expected_output=$'Found 4 person(s):\n  John Doe\n  Jane Smith\n  John von Neumann\n  Bob Brown'
        test "$(java -jar "$shaded_jar" "$input")" = "$expected_output"
        test "$(java -jar "$proguard_jar" "$input")" = "$expected_output"

        if jar --list --file "$shaded_jar" \
          | grep --extended-regexp '(^|/)module-info\.class$|^META-INF/.*\.(SF|DSA|RSA)$'; then
          exit 1
        fi

    - name: Verify Micronaut JAR manifests
      if: matrix.verification == 'manifest'
      run: |
        directory="$RUNNER_TEMP/consumer-fixtures/${{ matrix.example }}-consumer"
        revision="$(git -C "$directory" describe --tags --always --dirty=-dirty)"
        for application_jar in \
          "$directory/target/${{ matrix.artifact }}-$revision.jar" \
          "$directory/target/${{ matrix.artifact }}-$revision-proguard.jar"; do
          unzip -p "$application_jar" META-INF/MANIFEST.MF \
            | tr -d '\r' \
            | grep --fixed-strings --line-regexp 'Main-Class: de.neonew.orders.ApplicationKt'
        done

    - name: Build Micronaut container image
      if: matrix.example == 'kotlin-micronaut'
      working-directory: ${{ runner.temp }}/consumer-fixtures/kotlin-micronaut-consumer
      run: docker build --tag kotlin-micronaut-example:ci .

    - name: Verify GPG signatures
      run: |
        verification_home="$RUNNER_TEMP/gpg-verification"
        mkdir --mode=700 "$verification_home"
        gpg --batch --homedir "$verification_home" --import my-maven-setup-ci-key.pub.asc

        directory="$RUNNER_TEMP/consumer-fixtures/${{ matrix.example }}-consumer"
        revision="$(git -C "$directory" describe --tags --always --dirty=-dirty)"
        artifact="$directory/target/${{ matrix.artifact }}-${{ matrix.version }}"
        primary_artifact="$directory/target/${{ matrix.artifact }}-$revision.jar"
        if [ "${{ matrix.verification }}" = cap ]; then
          secondary_artifact="$directory/target/010203040506.cap"
        else
          secondary_artifact="$directory/target/${{ matrix.artifact }}-$revision-proguard.jar"
        fi
        signed_artifacts=(
          "$primary_artifact"
          "$secondary_artifact"
          "$artifact.pom"
        )

        for artifact in "${signed_artifacts[@]}"; do
          test -f "$artifact"
          test -f "$artifact.asc"
          gpg --batch --homedir "$verification_home" --verify "$artifact.asc" "$artifact"
        done

    - name: Run JavaCard CAP in Oracle simulator
      if: matrix.verification == 'cap'
      run: |
        sudo install -m 644 .github/oracle-javacard-simulator-reader.conf /etc/reader.conf.d/jcsdk.conf
        sudo systemctl stop pcscd.socket pcscd.service || true
        sudo pcscd --foreground --disable-polkit > "$RUNNER_TEMP/pcscd.log" 2>&1 &
        pcscd_pid=$!
        LD_LIBRARY_PATH=/opt/javacard/simulator/runtime/bin \
          /opt/javacard/simulator/runtime/bin/jcsl -p=9025 -log_level=finest \
          > "$RUNNER_TEMP/jcsl.log" 2>&1 &
        simulator_pid=$!
        trap 'kill "$simulator_pid" 2>/dev/null || true; sudo kill "$pcscd_pid" 2>/dev/null || true' EXIT

        card_ready=false
        for attempt in {1..60}; do
          if timeout 2 pcsc_scan -c 2>&1 | grep --quiet --ignore-case --extended-regexp \
            'card present|card inserted|card state:.*present|atr:'; then
            card_ready=true
            break
          fi
          sleep 0.5
        done
        if [ "$card_ready" != true ]; then
          cat "$RUNNER_TEMP/pcscd.log"
          cat "$RUNNER_TEMP/jcsl.log"
          exit 1
        fi

        unset GP_KEY GP_KEY_ENC GP_KEY_MAC GP_KEY_DEK
        java -jar "$RUNNER_TEMP/gp.jar" --install "$RUNNER_TEMP/consumer-fixtures/javacard-consumer/target/010203040506.cap"
        gpshell_output="$(gpshell "$RUNNER_TEMP/consumer-fixtures/javacard-consumer/hello.gpshell")"
        printf '%s\n' "$gpshell_output"
        grep --quiet 'Response <-- 48656C6C6F9000' <<< "$gpshell_output"

    - name: Scan for vulnerabilities
      run: |
        directory="$RUNNER_TEMP/consumer-fixtures/${{ matrix.example }}-consumer"
        revision="$(git -C "$directory" describe --tags --always --dirty=-dirty)"
        grype sbom:"$directory/target/${{ matrix.artifact }}-$revision.sbom.cyclonedx.json" --fail-on high

    - name: Upload example artifacts
      uses: actions/upload-artifact@v7.0.1
      with:
        name: ${{ matrix.example }}-example-artifacts
        if-no-files-found: error
        path: |
          ${{ runner.temp }}/consumer-fixtures/${{ matrix.example }}-consumer/target/*.jar
          ${{ runner.temp }}/consumer-fixtures/${{ matrix.example }}-consumer/target/*.cap
          ${{ runner.temp }}/consumer-fixtures/${{ matrix.example }}-consumer/target/*.pom
          ${{ runner.temp }}/consumer-fixtures/${{ matrix.example }}-consumer/target/*.jar.asc
          ${{ runner.temp }}/consumer-fixtures/${{ matrix.example }}-consumer/target/*.cap.asc
          ${{ runner.temp }}/consumer-fixtures/${{ matrix.example }}-consumer/target/*.pom.asc
          ${{ runner.temp }}/consumer-fixtures/${{ matrix.example }}-consumer/target/*.sbom.cyclonedx.json
          ${{ runner.temp }}/consumer-fixtures/${{ matrix.example }}-consumer/target/*.sbom.spdx.json
          ${{ runner.temp }}/consumer-fixtures/${{ matrix.example }}-consumer/target/surefire-reports/
          ${{ runner.temp }}/consumer-fixtures/${{ matrix.example }}-consumer/target/failsafe-reports/
          ${{ runner.temp }}/consumer-fixtures/${{ matrix.example }}-consumer/target/site/jacoco/

    - name: Upload public GPG key
      if: matrix.example == 'java'
      uses: actions/upload-artifact@v7.0.1
      with:
        name: my-maven-setup-ci-key.pub.asc
        if-no-files-found: error
        path: my-maven-setup-ci-key.pub.asc
