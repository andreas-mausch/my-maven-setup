services:
  mongodb:
    image: mongo:8.2.7
    ports:
      - "27017:27017"

  mongo-express:
    image: mongo-express:1.0.2-20
    depends_on:
      - mongodb
    environment:
      ME_CONFIG_BASICAUTH_ENABLED: "false"
      ME_CONFIG_MONGODB_URL: mongodb://mongodb:27017/
    ports:
      - "8081:8081"

  rabbitmq:
    image: rabbitmq:4.3.0-management
    ports:
      - "5672:5672"
      - "15672:15672"
